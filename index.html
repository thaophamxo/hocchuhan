<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#eef2e6">
<meta name="description" content="Vườn Chữ Hán — học tiếng Trung HSK 1–3 qua bài học, thẻ ghi nhớ, ôn tập ngắt quãng và bài luyện tập, giải nghĩa bằng tiếng Việt.">
<title>Vườn Chữ Hán — HSK 1–3 cho người Việt</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐼</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&family=Noto+Serif+SC:wght@500;900&display=swap" rel="stylesheet">
<style>
:root{--paper:#eef2e6;--card:#f8faf3;--moss:#3f5b3a;--moss2:#2c4129;--bamboo:#c9d6a8;--ink:#1f2a22;--mute:#5d6b5c;--plum:#7a3b5e;--line:#d3dcc2;--ok:#2f7d4f;--bad:#b3433b}
@media(prefers-color-scheme:dark){:root{--paper:#1a221b;--card:#232d24;--moss:#a7c58f;--moss2:#c9e0b4;--bamboo:#34452f;--ink:#e8eee0;--mute:#9fb09b;--plum:#d99ac0;--line:#35443a;--ok:#7fcf9c;--bad:#ef8d84}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:16px/1.55 "Be Vietnam Pro",system-ui,sans-serif;background:var(--paper);color:var(--ink);display:grid;grid-template-columns:248px 1fr}
.han{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--plum);outline-offset:2px}
aside{background:var(--moss2);color:#eef2e6;padding:22px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow:auto}
@media(prefers-color-scheme:dark){aside{background:#121912;color:#e8eee0}}
.brand{display:flex;gap:10px;align-items:center;margin-bottom:18px}
.brand b{font:900 30px/1 "Noto Serif SC",serif;background:var(--bamboo);color:#2c4129;border-radius:12px;padding:6px 8px}
.brand span{font-weight:700;line-height:1.2}.brand small{display:block;font-weight:400;opacity:.75;font-size:12px}
aside nav{display:flex;flex-direction:column;gap:2px}
aside h4{margin:14px 8px 4px;font-size:12px;font-weight:500;opacity:.65}
aside a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;color:inherit;text-decoration:none}
aside a:hover{background:rgba(255,255,255,.08)}
aside a.on{background:var(--bamboo);color:#2c4129;font-weight:700}
aside a i{font-style:normal;width:20px;text-align:center}
aside a em{margin-left:auto;font-style:normal;font-size:12px;background:var(--plum);color:#fff;border-radius:99px;padding:0 8px}
.mascot{margin-top:auto;background:rgba(255,255,255,.08);border-radius:14px;padding:12px;font-size:14px}
main{padding:28px clamp(16px,4vw,48px) 60px;max-width:1000px;width:100%}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:26px}h2{margin:26px 0 10px;font-size:18px}
.sub{color:var(--mute);margin:0}
.pill{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-weight:500}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.hero{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;background:var(--moss);color:#f4f8ec;border-radius:24px;padding:28px 32px}
@media(prefers-color-scheme:dark){.hero{background:#2b3a2a;color:#e8eee0}}
.hero .big{font-size:clamp(84px,14vw,150px);line-height:1;font-weight:900}
.hero .py{font-size:22px;font-weight:500}.hero .vi{font-size:18px;opacity:.92}.hero .hv{opacity:.7;font-size:14px}
.btn{background:var(--moss);color:var(--paper);border:0;border-radius:12px;padding:10px 18px;font-weight:700}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--moss)}
.hero .btn{background:var(--bamboo);color:#2c4129}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden}.bar>div{height:100%;background:var(--moss)}
.lesson{text-align:left;width:100%}.lesson:hover{border-color:var(--moss)}
.lesson b{display:block}.lesson .han{font-size:22px;color:var(--moss)}
.w{display:grid;grid-template-columns:90px 1fr auto;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.w .han{font-size:32px;font-weight:900}.w small{color:var(--mute)}
.ico{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 10px}
input,select{font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 14px;width:100%;max-width:420px}
.flash{perspective:900px;margin:10px auto;max-width:460px}
.face{min-height:290px;background:var(--card);border:1px solid var(--line);border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;cursor:pointer;width:100%}
.face .han{font-size:96px;font-weight:900;line-height:1.1}
.face .vi{font-size:26px;font-weight:700}.face .py{font-size:22px;color:var(--plum)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 16px}
.opt:hover{border-color:var(--moss)}.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card))}
.q{max-width:520px;margin:auto}.q .han{font-size:84px;font-weight:900;text-align:center;line-height:1.2}.q .vi{font-size:30px;text-align:center;font-weight:700}
.stat{font-size:34px;font-weight:700;color:var(--moss)}
.empty{text-align:center;padding:40px 10px;color:var(--mute)}
@media(max-width:820px){
 body{grid-template-columns:1fr}
 aside{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:10px;gap:4px}
 aside .brand,aside h4,.mascot{display:none}aside nav{flex-direction:row}aside a{white-space:nowrap;padding:8px 12px}
 .hero{grid-template-columns:1fr;text-align:center;padding:22px}
}
@media(prefers-reduced-motion:no-preference){.face{transition:transform .2s}.face:active{transform:scale(.98)}}
.tabs .btn{min-width:84px}.face .vi{font-size:22px}.opt small{display:block}
</style>
</head>
<body>
<aside>
 <div class="brand"><b class="han">汉</b><span>Vườn Chữ Hán<small>HSK 1–3 · tiếng Việt</small></span></div>
 <nav id="nav"></nav>
 <div class="mascot">🐼 <b>Trúc bên bạn!</b><br>Mỗi ngày một ít, chữ sẽ nảy mầm 🌱</div>
</aside>
<main id="main" tabindex="-1"></main>
<script src="data/hsk-data.js"></script>
<script>
// ===== Dữ liệu: data/hsk-data.js → [cấp, chữ, pinyin, nghĩa, từ loại] =====
const W=[],LESSONS=[],PER=20;
[1,2,3].forEach(lv=>{const ws=HSK_DATA.filter(r=>r[0]===lv);for(let i=0;i<ws.length;i+=PER){const li=LESSONS.length,part=ws.slice(i,i+PER);LESSONS.push([`HSK ${lv} · Bài ${i/PER+1}`,part.map(r=>r[1]),lv]);part.forEach(r=>W.push({id:W.length,h:r[1],p:r[2],v:r[3],s:r[3].split(";")[0],hv:HV[r[1]]||"",lv,l:li}))}});
// ===== Trạng thái (lưu trong trình duyệt) =====
const KEY="vuon-chu-han-v2",GAP=[0,1,2,4,8,16];
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=Object.assign({cards:{},lv:1,xp:0,streak:0,last:"",goal:10,log:{}},S||{});
const day=(o=0)=>{const d=new Date();d.setDate(d.getDate()+o);return d.toLocaleDateString("sv")};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
function touch(n=1){const t=day();if(S.last!==t){S.streak=S.last===day(-1)?S.streak+1:1;S.last=t}S.log[t]=(S.log[t]||0)+n;save()}
function grade(id,ok){const c=S.cards[id]||{b:0,d:day()};c.b=ok?Math.min(5,c.b+1):0;c.d=day(GAP[c.b]);S.cards[id]=c;S.xp+=ok?2:0;touch()}
const due=()=>W.filter(w=>S.cards[w.id]&&S.cards[w.id].d<=day());
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").toLowerCase();
const speak=t=>{try{const u=new SpeechSynthesisUtterance(t);u.lang="zh-CN";u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}};
const $=s=>document.querySelector(s),M=$("#main");
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const head=(t,sub,extra="")=>`<div class="top"><div><h1>${t}</h1><p class="sub">${sub}</p></div>${extra}</div>`;
const wordRow=w=>`<div class="w"><span class="han">${w.h}</span><div><b>${w.v}</b><br><small>${w.p}${w.hv?" · Hán Việt: "+w.hv:""}</small></div><button class="ico" onclick="speak('${w.h}')" aria-label="Nghe phát âm ${w.h}">🔊</button></div>`;
// ===== Màn hình =====
const V={};
V.home=()=>{const P1=W.filter(w=>w.lv===1),w=P1[[...day()].reduce((a,c)=>a*31+c.charCodeAt(0),0)%P1.length],n=S.log[day()]||0,pct=Math.min(100,n/S.goal*100),d=due().length;
 return head("Tổng quan","Chào mừng bạn đến với khu vườn chữ Hán.",`<span class="pill">🔥 ${S.streak} ngày · ✦ ${S.xp} XP</span>`)+
 `<section class="hero"><div class="big han" lang="zh">${w.h}</div><div><div class="hv">Chữ của hôm nay</div><div class="py">${w.p} <button class="ico" style="color:inherit" onclick="speak('${w.h}')" aria-label="Nghe">🔊</button></div><div class="vi">${w.v}</div>${w.hv?`<div class="hv">Âm Hán Việt: ${w.hv}</div>`:""}<div class="row"><a href="#lessons"><button class="btn">Bắt đầu học</button></a></div></div></section>
 <h2>Mục tiêu hôm nay</h2><div class="card"><p class="sub">${n}/${S.goal} lượt luyện tập</p><div class="bar" role="progressbar" aria-valuenow="${pct|0}" aria-valuemin="0" aria-valuemax="100"><div style="width:${pct}%"></div></div></div>
 <div class="grid" style="margin-top:14px"><div class="card"><div class="stat">${d}</div>thẻ cần ôn hôm nay<div class="row"><a href="#review"><button class="btn alt">Ôn tập</button></a></div></div><div class="card"><div class="stat">${Object.keys(S.cards).length}/${W.length}</div>từ đã gặp<div class="row"><a href="#trainer"><button class="btn alt">Luyện tập</button></a></div></div></div>`};
V.lessons=()=>{const L=LESSONS.map((l,i)=>[l,i]).filter(([l])=>l[2]===S.lv);return head("Bài học",`${LESSONS.length} bài · ${W.length} từ (HSK 3.0, cấp 1–3)`)+`<div class="row tabs" style="margin:0 0 14px">${[1,2,3].map(n=>`<button class="btn ${n===S.lv?"":"alt"}" onclick="S.lv=${n};save();route()">HSK ${n}</button>`).join("")}</div><div class="grid">${L.map(([l,i])=>{const k=W.filter(w=>w.l===i&&S.cards[w.id]).length;return `<button class="card lesson" onclick="openLesson(${i})"><span class="han">${l[1][0]}</span><b>${l[0]}</b><small class="sub">${k}/${l[1].length} từ đã học</small><div class="bar" style="margin-top:8px"><div style="width:${k/l[1].length*100}%"></div></div></button>`}).join("")}</div>`};
window.openLesson=i=>{M.innerHTML=head(`${LESSONS[i][0]}`,"Nghe, đọc rồi chuyển sang thẻ ghi nhớ.",`<a href="#lessons"><button class="btn alt">← Danh sách bài</button></a>`)+`<div class="card">${W.filter(w=>w.l===i).map(wordRow).join("")}</div><div class="row"><button class="btn" onclick="startCards(${i})">Học bằng thẻ</button></div>`;scrollTo(0,0)};
V.dict=()=>head("Từ điển",`${W.length} từ HSK 1–3. Gõ chữ Hán, pinyin hoặc tiếng Việt (không dấu cũng được).`)+`<div class="row" style="margin:0 0 8px"><input id="q" type="search" placeholder="Ví dụ: xin chao, nǐ, 水…" aria-label="Tìm từ"><select id="dlv" aria-label="Cấp độ" style="max-width:140px"><option value="0">Mọi cấp</option><option>1</option><option>2</option><option>3</option></select></div><p class="sub" id="dc"></p><div class="card" id="dl"></div>`;
V.dict.after=()=>{const f=()=>{const q=norm($("#q").value.trim()),lv=+$("#dlv").value;const r=W.filter(w=>(!lv||w.lv===lv)&&(!q||norm(w.h+w.p+w.v+w.hv).includes(q)));$("#dc").textContent=`${r.length} kết quả`+(r.length>100?" (hiển thị 100 từ đầu, hãy gõ thêm để lọc)":"");$("#dl").innerHTML=r.length?r.slice(0,100).map(wordRow).join(""):'<div class="empty">Không tìm thấy từ nào. Thử gõ ngắn hơn nhé.</div>'};$("#q").oninput=f;$("#dlv").onchange=f;f()};
let ST;
V.cards=()=>head("Thẻ ghi nhớ","Chạm vào thẻ để lật. Chọn bài muốn học:")+`<select id="ls" aria-label="Chọn bài">${[1,2,3].map(n=>`<optgroup label="HSK ${n}">${LESSONS.map((l,i)=>l[2]===n?`<option value="${i}">${l[0]}</option>`:"").join("")}</optgroup>`).join("")}</select><div id="st" style="margin-top:16px"></div>`;
let PEND=0;
V.cards.after=()=>{const s=$("#ls");s.onchange=e=>{PEND=+e.target.value;begin(W.filter(w=>w.l===PEND),"st")};s.value=PEND;s.onchange({target:s})};
window.startCards=i=>{PEND=i;location.hash==="#cards"?route():location.hash="cards"};
function begin(list,target){ST={q:shuffle(list),i:0,f:false,t:target,n:0};draw()}
function draw(){const el=$("#"+ST.t);if(!ST.q.length){el.innerHTML=`<div class="empty">🎉 Hôm nay không còn thẻ nào cần ôn.<br>Hãy học bài mới để thêm thẻ.</div>`;return}
 if(ST.i>=ST.q.length){el.innerHTML=`<div class="empty"><div style="font-size:48px">🌱</div><b>Xong rồi! Bạn đã ôn ${ST.q.length} thẻ.</b><div class="row" style="justify-content:center"><button class="btn" onclick="begin(ST.q,'${ST.t}')">Học lại</button><a href="#home"><button class="btn alt">Về tổng quan</button></a></div></div>`;return}
 const w=ST.q[ST.i];el.innerHTML=`<p class="sub" style="text-align:center">Thẻ ${ST.i+1}/${ST.q.length}</p><div class="flash"><button class="face" onclick="ST.f=!ST.f;if(ST.f)speak('${w.h}');draw()" aria-label="Lật thẻ">${ST.f?`<div class="py">${w.p}</div><div class="vi">${w.v}</div><div class="han" style="font-size:40px">${w.h}</div>${w.hv?`<small class="sub">Hán Việt: ${w.hv}</small>`:""}`:`<div class="han" lang="zh">${w.h}</div><small class="sub">Chạm để xem nghĩa</small>`}</button></div>${ST.f?`<div class="row" style="justify-content:center"><button class="btn alt" onclick="ans(0)">Chưa nhớ</button><button class="btn" onclick="ans(1)">Đã nhớ</button></div>`:""}`}
window.ans=ok=>{grade(ST.q[ST.i].id,ok);ST.i++;ST.f=false;draw()};
let T;
V.trainer=()=>head("Luyện tập","Trả lời 10 câu trắc nghiệm, mỗi câu đúng được 2 XP.")+`<label for="tl">Cấp độ:</label> <select id="tl" style="max-width:120px"><option>1</option><option>2</option><option>3</option></select><div class="row"><button class="btn" onclick="tr('hv')">Chữ Hán → nghĩa</button><button class="btn alt" onclick="tr('vh')">Nghĩa → chữ Hán</button></div><div id="tq" style="margin-top:20px"></div>`;
window.tr=m=>{const P=W.filter(w=>w.lv===+$("#tl").value);T={m,P,q:shuffle(P).slice(0,10),i:0,s:0,done:false};tq()};
function tq(){const el=$("#tq");if(!el)return;if(T.i>=T.q.length){el.innerHTML=`<div class="empty"><div style="font-size:48px">${T.s>=8?"🌳":"🌿"}</div><b>Bạn đúng ${T.s}/10 câu.</b><div class="row" style="justify-content:center"><button class="btn" onclick="tr('${T.m}')">Chơi lại</button></div></div>`;return}
 const w=T.q[T.i],o=shuffle([w,...shuffle(T.P.filter(x=>x.id!==w.id&&x.s!==w.s)).slice(0,3)]),hv=T.m==="hv";T.done=false;
 el.innerHTML=`<div class="q"><p class="sub" style="text-align:center">Câu ${T.i+1}/10</p>${hv?`<div class="han" lang="zh">${w.h}</div><p class="sub" style="text-align:center">${w.p}</p>`:`<div class="vi">${w.s}</div>`}${o.map(x=>`<button class="opt ${hv?"":"han"}" data-id="${x.id}" onclick="pick(this,${w.id})">${hv?x.s:x.h+' <small class="sub" style="font-family:Be Vietnam Pro">'+x.p+'</small>'}</button>`).join("")}</div>`}
window.pick=(b,id)=>{if(T.done)return;T.done=true;const ok=+b.dataset.id===id;if(ok){T.s++;S.xp+=2}touch();b.classList.add(ok?"ok":"bad");if(!ok)document.querySelector(`.opt[data-id="${id}"]`).classList.add("ok");setTimeout(()=>{T.i++;tq()},ok?700:1500)};
V.review=()=>{const d=due();return head("Ôn tập ngắt quãng",`${d.length} thẻ đến hạn hôm nay. Thẻ nhớ tốt sẽ xuất hiện thưa dần (1, 2, 4, 8, 16 ngày).`)+`<div id="rv"></div>`};
V.review.after=()=>begin(due(),"rv");
V.progress=()=>{const k=Object.values(S.cards);return head("Tiến độ","Khu vườn của bạn đang lớn dần.")+`<div class="grid"><div class="card"><div class="stat">${k.length}</div>từ đã gặp</div><div class="card"><div class="stat">${k.filter(c=>c.b>=3).length}</div>từ nhớ vững</div><div class="card"><div class="stat">${S.streak}</div>ngày liên tiếp</div><div class="card"><div class="stat">${S.xp}</div>XP</div></div><h2>Theo cấp độ</h2><div class="card">${[1,2,3].map(n=>{const a=W.filter(w=>w.lv===n),s=a.filter(w=>S.cards[w.id]).length,m=a.filter(w=>S.cards[w.id]&&S.cards[w.id].b>=3).length;return `<p style="margin:10px 0 4px">HSK ${n} <small class="sub">${s}/${a.length} đã gặp · ${m} nhớ vững</small></p><div class="bar"><div style="width:${s/a.length*100}%"></div></div>`}).join("")}</div>`};
V.settings=()=>head("Cài đặt","Dữ liệu chỉ lưu trong trình duyệt này.")+`<div class="card"><label for="g">Mục tiêu mỗi ngày (số lượt luyện tập)</label><br><input id="g" type="number" min="1" max="200" value="${S.goal}" style="margin-top:8px"><div class="row"><button class="btn" onclick="S.goal=Math.max(1,+$('#g').value||10);save();alert('Đã lưu mục tiêu.')">Lưu mục tiêu</button><button class="btn alt" onclick="if(confirm('Xoá toàn bộ tiến độ? Không thể hoàn tác.')){localStorage.removeItem(KEY);location.reload()}">Xoá tiến độ</button></div></div><h2>Nguồn dữ liệu</h2><div class="card"><p>Danh sách từ: HSK 3.0 cấp 1–3 từ <a href="https://github.com/drkameleon/complete-hsk-vocabulary">complete-hsk-vocabulary</a> (MIT) qua bộ <a href="https://github.com/leiinc/hocchu">HocChu</a>. Nghĩa gốc: CC-CEDICT; bản tiếng Việt do HocChu biên tập (CC BY-SA 4.0), <b>chưa được người bản ngữ duyệt</b>. Âm Hán Việt chỉ có ở một số từ.</p></div>`;

function route(){const r=(location.hash.slice(1)||"home");const v=V[r]?r:"home";const n=due().length;
